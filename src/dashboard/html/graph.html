<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Species Relationship Map · Genus-Level Ecosystem Network</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f5f9ff; --panel: #ffffff; --line: #cfe6ff; --blue: #4aa3ff;
      --blue2: #88c7ff; --text: #1e293b; --muted: #475569;
      --border-light: #e2edf7; --shadow-sm: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
      --shadow-md: 0 12px 28px rgba(16,24,40,0.08); --radius: 18px;
    }
    body {
      height: 100vh; width: 100vw; background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .filter-bar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
      padding: 12px 24px; display: flex; flex-wrap: wrap;
      align-items: center; gap: 16px 24px; box-shadow: var(--shadow-sm);
    }
    .filter-group {
      display: flex; align-items: center; gap: 10px;
      background: var(--panel); border-radius: 44px;
      padding: 6px 20px 6px 22px; border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm); transition: all 0.2s ease;
    }
    .filter-group:hover { border-color: var(--blue2); box-shadow: 0 4px 14px rgba(74,163,255,0.12); }
    .filter-group label { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
    .filter-group select {
      border: none; background: transparent; font-size: 0.85rem; font-weight: 500;
      padding: 8px 4px; min-width: 130px; cursor: pointer; color: var(--text);
      outline: none; font-family: inherit;
    }
    .filter-group select:disabled { opacity: 0.55; cursor: not-allowed; }
    .badge-info {
      font-size: 0.7rem; background: #eef4ff; padding: 4px 14px;
      border-radius: 30px; color: #2c5f8a; font-weight: 500;
    }
    .graph-stage { height: calc(100vh - 74px); padding: 14px 18px 18px 18px; }
    .graph-card {
      height: 100%; border-radius: var(--radius);
      background: radial-gradient(ellipse at 20% 30%, rgba(136,199,255,0.1), #ffffff 70%);
      border: 1px solid rgba(207,230,255,0.8); box-shadow: var(--shadow-md);
      overflow: hidden; position: relative; backdrop-filter: blur(2px);
    }
    svg { width: 100%; height: 100%; display: block; cursor: grab; }
    svg:active { cursor: grabbing; }
    .graph-loader {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); color: white;
      padding: 6px 16px; border-radius: 40px; font-size: 0.75rem;
      pointer-events: none; z-index: 25;
    }
    .empty-hint {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(255,255,245,0.92); backdrop-filter: blur(6px);
      padding: 12px 28px; border-radius: 60px; font-size: 0.85rem; font-weight: 500;
      color: #2c5282; border: 1px solid #bdd9ff; pointer-events: none;
      white-space: nowrap; box-shadow: var(--shadow-sm);
    }
    @media (max-width: 780px) {
      .filter-group select { min-width: 100px; }
      .badge-info { display: none; }
      .empty-hint { white-space: normal; text-align: center; width: 80%; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
<div class="filter-bar">
  <div class="filter-group">
    <label for="kingdomSelect">Kingdom</label>
    <select id="kingdomSelect"></select>
  </div>
  <div class="filter-group">
    <label for="categorySelect">Category</label>
    <select id="categorySelect"></select>
  </div>
  <div class="filter-group">
    <label for="genusSelect">Genus</label>
    <select id="genusSelect"></select>
  </div>
  <div class="badge-info">🌿 Selecting a “genus” automatically loads the phylogenetic tree of the species within that genus</div>
</div>
<div class="graph-stage">
  <div class="graph-card" id="graphCard">
    <svg id="graphSvg"></svg>
    <div id="loadingToast" class="graph-loader" style="display:none;">🔄 Loading the map...</div>
    <div id="emptyMsg" class="empty-hint" style="display:none;">✨ Please select a “genus” to view the ecological network</div>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:8001";
  const MIN_WEIGHT = 0;
  let svg = d3.select("#graphSvg");
  let rootG = svg.append("g"), linkG = rootG.append("g"), nodeG = rootG.append("g");
  let width = 800, height = 600, simulation = null;
  let currentAbortController = null, currentRequestId = 0;
  let taxonomy = { kingdoms: new Set(), kingdomMap: new Map() };
  let currentSelectedGenus = "";

  function clearGraphVisual() {
    if (simulation) simulation.stop();
    linkG.selectAll("*").remove();
    nodeG.selectAll("*").remove();
    simulation = null;
  }
  function setLoading(visible, msg = "🔄 Loading the map...") {
    const toast = document.getElementById("loadingToast"), empty = document.getElementById("emptyMsg");
    if (visible) { toast.style.display = "flex"; toast.innerText = msg; empty.style.display = "none"; }
    else toast.style.display = "none";
  }
  function showEmptyHint(show, customMsg = null) {
    const empty = document.getElementById("emptyMsg");
    if (show) {
      empty.innerText = customMsg || "✨ Please select a genus to view the ecological network";
      empty.style.display = "block";
      setLoading(false);
    } else empty.style.display = "none";
  }

  function colorForType(type) {
    return "#bcdcff";
  }
  function radiusFor(node) { return 9 + Math.min(24, Math.max(0, Number(node.value ?? 0.5)) * 16); }
  function strokeFor(node) { return node.type === "animal" ? "#2f7fd9" : "#8fc9ff"; }

  function resizeGraph() {
    const rect = document.getElementById("graphCard").getBoundingClientRect();
    width = Math.max(320, rect.width); height = Math.max(320, rect.height);
    svg.attr("viewBox", `0 0 ${width} ${height}`);
    if (simulation) simulation.force("center", d3.forceCenter(width/2, height/2)).alpha(0.4).restart();
  }
  window.addEventListener("resize", () => resizeGraph());
  const zoom = d3.zoom().scaleExtent([0.2, 6]).on("zoom", (e) => rootG.attr("transform", e.transform));
  svg.call(zoom).on("dblclick", (e) => { if (e.target.tagName === "svg") svg.transition().duration(350).call(zoom.transform, d3.zoomIdentity); });
  function fitToView(nodes) {
    const xs = nodes.map(d=>d.x).filter(Number.isFinite), ys = nodes.map(d=>d.y).filter(Number.isFinite);
    if (!xs.length) return;
    const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
    const pad=55, graphW=(maxX-minX)+pad*2, graphH=(maxY-minY)+pad*2;
    const scale = Math.min(width/graphW, height/graphH);
    const tx = width/2 - scale*((minX+maxX)/2), ty = height/2 - scale*((minY+maxY)/2);
    svg.transition().duration(420).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(Math.min(scale,2.2)));
  }
  function renderGraph(data) {
    clearGraphVisual();
    const nodes = (data.nodes||[]).map(d=>({...d})), links = (data.links||[]).map(d=>({...d}));
    if (!nodes.length) { showEmptyHint(true, "⚠️ There are currently no associated genomic data for this genus."); return; }
    showEmptyHint(false);
    const linkSel = linkG.selectAll("line").data(links).enter().append("line")
      .attr("stroke","#cae3fc").attr("stroke-opacity",0.85)
      .attr("stroke-width", d=>1.2+Math.sqrt(Math.max(0.01,Number(d.value??0.8)))*1.6).attr("stroke-linecap","round");
    const nodeGroup = nodeG.selectAll("g").data(nodes,d=>d.id).enter().append("g")
      .call(d3.drag().on("start",(e,d)=>{if(!e.active)simulation?.alphaTarget(0.2).restart(); d.fx=d.x;d.fy=d.y;})
        .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;})
        .on("end",(e,d)=>{if(!e.active)simulation?.alphaTarget(0); d.fx=null;d.fy=null;}));
    nodeGroup.append("circle").attr("r", d => radiusFor(d)).attr("fill", "#4aa3ff").attr("stroke", "#2f7fd9").attr("stroke-width", 2);
    nodeGroup.append("text").text(d=>d.id).attr("text-anchor","middle").attr("dy",d=>radiusFor(d)+14)
      .attr("font-size",11).attr("font-weight",500).attr("fill","#1e293b").attr("opacity",0.9).style("pointer-events","none");
    simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d=>d.id).distance(d=>130-Math.min(100, Number(d.value??1)*70)).strength(0.4))
      .force("charge", d3.forceManyBody().strength(-550))
      .force("collide", d3.forceCollide().radius(d=>radiusFor(d)+13).strength(0.85))
      .force("center", d3.forceCenter(width/2, height/2));
    const centerNode = nodes.find(n=>n.id === data.center);
    if (links.length === 1) {
    const centerNode = nodes.find(n => n.id === data.center);
    const otherNode = nodes.find(n => n.id !== data.center);
    if (centerNode && otherNode) {
        // Set fixed positions (set x, y, fx, and fy at the same time)
        centerNode.x = width/2;
        centerNode.y = height/2;
        centerNode.fx = centerNode.x;
        centerNode.fy = centerNode.y;
        otherNode.x = width/2 + 350;
        otherNode.y = height/2;
        otherNode.fx = otherNode.x;
        otherNode.fy = otherNode.y;

        // Update links
        linkSel.attr("x1", centerNode.x).attr("y1", centerNode.y)
               .attr("x2", otherNode.x).attr("y2", otherNode.y);
        // Update node positions
        nodeGroup.attr("transform", d => `translate(${d.x},${d.y})`);
        // Adjust the view
        fitToView(nodes);
        return;
    }
}
    if (centerNode) { centerNode.fx = width/2; centerNode.fy = height/2; centerNode.fixed = true; }
    simulation.on("tick",()=>{
      linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
      nodeGroup.attr("transform",d=>`translate(${d.x},${d.y})`);
    });
    let fitted=false;
    simulation.on("end",()=>{ if(!fitted && nodes.length) { fitToView(nodes); fitted=true; } });
    setTimeout(()=>{ if(!fitted && nodes.length) { fitToView(nodes); fitted=true; } },900);
  }

  async function fetchGraphBySpecies(speciesName) {
    if (!speciesName) { clearGraphVisual(); showEmptyHint(true,"⚠️ No valid species representative"); return false; }
    if (currentAbortController) currentAbortController.abort();
    currentAbortController = new AbortController();
    const reqId = ++currentRequestId;
    try {
      setLoading(true, `📡 Loading the network associated with “${speciesName}”...`);
      const res = await fetch(`${API_BASE}/graph?animal=${encodeURIComponent(speciesName)}&min_weight=${MIN_WEIGHT}`, { signal: currentAbortController.signal, headers:{'Accept':'application/json'} });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const graphData = await res.json();
      if (reqId !== currentRequestId) return false;
      if (!graphData.nodes || !graphData.nodes.length) { clearGraphVisual(); showEmptyHint(true, `🌿 “${speciesName}” No related data available`); setLoading(false); return false; }
      renderGraph(graphData);
      setLoading(false);
      return true;
    } catch(err) {
      if (err.name !== "AbortError") { console.error(err); clearGraphVisual(); showEmptyHint(true, "⚠️ Loading failed. Please check the backend."); setLoading(false); }
      return false;
    }
  }

  function getExampleSpeciesFromGenus(genusName, kingdomName, categoryName) {
    const kingData = taxonomy.kingdomMap.get(kingdomName);
    if (kingData && kingData.genusToExampleSpecies && kingData.genusToExampleSpecies.has(genusName))
      return kingData.genusToExampleSpecies.get(genusName);
    return `${genusName} sp.`;
  }

  async function onGenusChanged(genusVal, kingdomVal, categoryVal) {
    if (!genusVal) { clearGraphVisual(); showEmptyHint(true, "Please select a genus"); return; }
    await fetchGraphBySpecies(genusVal);  // Pass the genus name directly
}

  async function loadTaxonomyFromBackend() {
    const res = await fetch(`${API_BASE}/api/species_for_graph`, { headers:{'Accept':'application/json'} });
    if (!res.ok) throw new Error(`Unable to retrieve species data: ${res.status}`);
    const speciesList = await res.json();
    if (!Array.isArray(speciesList) || !speciesList.length) throw new Error("No data available");
    const tmpMap = new Map();
    for (const rec of speciesList) {
      const kingdom = rec.kingdom || "Unclassified Kingdom";
      const category = rec.category || "Unclassified Category";
      const genus = rec.genus || "Unknown Genus";
      let speciesName = rec.species;
      if (!speciesName) speciesName = genus !== "Unknown Genus" ? `${genus}` : `Species_${genus}`;
      if (!tmpMap.has(kingdom)) tmpMap.set(kingdom, { categorySet: new Set(), genusByCategory: new Map(), genusToExampleSpecies: new Map() });
      const entry = tmpMap.get(kingdom);
      entry.categorySet.add(category);
      if (!entry.genusByCategory.has(category)) entry.genusByCategory.set(category, new Set());
      entry.genusByCategory.get(category).add(genus);
      if (!entry.genusToExampleSpecies.has(genus)) entry.genusToExampleSpecies.set(genus, speciesName);
    }
    taxonomy.kingdoms = new Set(tmpMap.keys());
    taxonomy.kingdomMap = tmpMap;
    return true;
  }

  async function initUI() {
    const kingdomSel = document.getElementById("kingdomSelect");
    const categorySel = document.getElementById("categorySelect");
    const genusSel = document.getElementById("genusSelect");
    kingdomSel.innerHTML = '<option value="">-- Select Kingdom --</option>';
    Array.from(taxonomy.kingdoms).sort().forEach(k => { kingdomSel.innerHTML += `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`; });
    kingdomSel.addEventListener("change", () => {
      const k = kingdomSel.value;
      categorySel.innerHTML = '<option value="">-- Select Category --</option>';
      genusSel.innerHTML = '<option value="">-- Select Genus --</option>';
      genusSel.disabled = true;
      if (!k) { categorySel.disabled=true; clearGraphVisual(); showEmptyHint(true,"Please select kingdom"); return; }
      const kdata = taxonomy.kingdomMap.get(k);
      if (kdata && kdata.categorySet.size) {
        Array.from(kdata.categorySet).sort().forEach(c => { categorySel.innerHTML += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`; });
        categorySel.disabled = false;
      } else categorySel.disabled = true;
      clearGraphVisual(); showEmptyHint(true,"Please select category and genus");
    });
    categorySel.addEventListener("change", () => {
      const k = kingdomSel.value, c = categorySel.value;
      genusSel.innerHTML = '<option value="">-- Select Genus --</option>';
      if (!k || !c) { genusSel.disabled=true; clearGraphVisual(); showEmptyHint(true,"Please make your selection in full"); return; }
      const kdata = taxonomy.kingdomMap.get(k);
      const genusSet = kdata?.genusByCategory.get(c);
      if (genusSet && genusSet.size) {
        Array.from(genusSet).sort().forEach(g => { genusSel.innerHTML += `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`; });
        genusSel.disabled = false;
      } else genusSel.disabled = true;
      clearGraphVisual(); showEmptyHint(true,"Please select a genus");
    });
    genusSel.addEventListener("change", async () => {
      const k = kingdomSel.value, c = categorySel.value, g = genusSel.value;
      if (!g) { clearGraphVisual(); showEmptyHint(true,"Please select a genus"); return; }
      await onGenusChanged(g, k, c);
    });
    if (taxonomy.kingdoms.size) {
      const firstKingdom = Array.from(taxonomy.kingdoms).sort()[0];
      kingdomSel.value = firstKingdom;
      kingdomSel.dispatchEvent(new Event("change"));
      setTimeout(() => {
        const kdata = taxonomy.kingdomMap.get(firstKingdom);
        if (kdata && kdata.categorySet.size) {
          const firstCat = Array.from(kdata.categorySet).sort()[0];
          categorySel.value = firstCat;
          categorySel.dispatchEvent(new Event("change"));
          setTimeout(() => {
            const genusSet = kdata.genusByCategory.get(firstCat);
            if (genusSet && genusSet.size) {
              const firstGenus = Array.from(genusSet).sort()[0];
              genusSel.value = firstGenus;
              genusSel.dispatchEvent(new Event("change"));
            } else showEmptyHint(true, "There is no data in the current category");
          }, 80);
        } else showEmptyHint(true, "There is no data in the current kingdom");
      }, 100);
    }
  }

  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

  (async function main() {



    resizeGraph();
    new ResizeObserver(()=>resizeGraph()).observe(document.getElementById("graphCard"));
    showEmptyHint(true, "Loading data...");
    try {
      await loadTaxonomyFromBackend();
      await initUI();
    } catch(err) {
      console.error(err);
      showEmptyHint(true, "Initialisation failed. Please check whether the backend service is available.");
    }
  })();
</script>
</body>
</html>
