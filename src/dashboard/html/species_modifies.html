<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.heat/dist/leaflet-heat.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>

<style>
html, body { height:100%; margin:0; }

#map {
    position:absolute;
    top:0; bottom:0; left:0; right:0;
}

/* Keep your UI */
.custom-panel {
    position: fixed;
    z-index: 10000;
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    font-family: sans-serif;
}

.left-panel { top:20px; left:20px; width:140px; }
.right-panel { top:20px; right:20px; width:260px; max-height:80vh; overflow-y:auto; }

.panel-title {
    font-weight:bold;
    font-size:14px;
    margin-bottom:10px;
    border-bottom:1px solid #eee;
    padding-bottom:5px;
}

.item {
    display:flex;
    align-items:center;
    margin:6px 0;
    font-size:13px;
}
.item input { margin-right:8px; }

</style>
</head>

<body>

<div id="map"></div>

<!-- Left side: cities -->
<div class="custom-panel left-panel">
    <div class="panel-title">City Selection</div>
    <div id="city-panel"></div>
</div>

<!-- Right side: species -->
<div class="custom-panel right-panel">
<div class="panel-title">Species Filter</div>

<div class="item">
    <select id="kingdom-select" style="width:100%"></select>
</div>

<div class="item">
    <select id="category-select" style="width:100%"></select>
</div>

<div class="item">
    <select id="genus-select" style="width:100%"></select>
</div>

<hr>

</div> 

<script>

// Initialize map
// Initialize map
const map = L.map('map').setView([35, 110], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png').addTo(map);

// Global variables
let allData = [];            // Store raw backend data
let activeCities = new Set(); // Store selected city names
let mainHeatLayer = null;    // Single global heat layer

// UI elements
const cityPanel = document.getElementById('city-panel');
const kSelect = document.getElementById('kingdom-select');
const cSelect = document.getElementById('category-select');
const gSelect = document.getElementById('genus-select');

// Load data
fetch('http://' + window.location.hostname + ':8001/api/species')
    .then(res => res.json())
    .then(data => {
        allData = data;
        const hierarchy = {};
        const cities = new Set();

        // 1. Build the hierarchy and city list
        data.forEach(d => {
            cities.add(d.city);
            if (!hierarchy[d.kingdom]) hierarchy[d.kingdom] = {};
            if (!hierarchy[d.kingdom][d.category]) hierarchy[d.kingdom][d.category] = {};
            if (!hierarchy[d.kingdom][d.category][d.genus]) hierarchy[d.kingdom][d.category][d.genus] = [];
        });

        // 2. Initialize city UI
        Array.from(cities).sort().forEach(city => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<input type="checkbox" onchange="toggleCity('${city}', this.checked)"> ${city}`;
            cityPanel.appendChild(div);
        });

        // 3. Initialize species dropdowns
        updateSpeciesDropdowns();
    });

// ===== Core control logic =====

// City selection toggle
function toggleCity(city, isChecked) {
    if (isChecked) activeCities.add(city);
    else activeCities.delete(city);
    updateSpeciesDropdowns();
    updateMap();
}
function updateSpeciesDropdowns() {
    // Save the species values the user has already selected so the option refresh does not forcibly reset them to empty
    const currentK = kSelect.value;
    const currentC = cSelect.value;
    const currentG = gSelect.value;

    // 1. Filter data for the currently selected cities (if none are selected, treat it as all selected and show all species options)
    const cityFilteredData = allData.filter(d => {
        return activeCities.size === 0 ? true : activeCities.has(d.city);
    });

    // 2. Rebuild the species hierarchy based on the filtered city data
    const hierarchy = {};
    cityFilteredData.forEach(d => {
        if (!hierarchy[d.kingdom]) hierarchy[d.kingdom] = {};
        if (!hierarchy[d.kingdom][d.category]) hierarchy[d.kingdom][d.category] = {};
        if (!hierarchy[d.kingdom][d.category][d.genus]) hierarchy[d.kingdom][d.category][d.genus] = [];
    });

    // 3. Refresh the Kingdom dropdown
    kSelect.innerHTML = '<option value="">-- Select Kingdom --</option>';
    Object.keys(hierarchy).sort().forEach(k => {
        kSelect.innerHTML += `<option value="${k}">${k}</option>`;
    });
    // Restore the previous value if it still exists in the current cities
    if (hierarchy[currentK]) {
        kSelect.value = currentK;
    }

    // 4. Refresh the Category dropdown
    cSelect.innerHTML = '<option value="">-- Select Category --</option>';
    if (kSelect.value && hierarchy[kSelect.value]) {
        Object.keys(hierarchy[kSelect.value]).sort().forEach(c => {
            cSelect.innerHTML += `<option value="${c}">${c}</option>`;
        });
        if (hierarchy[kSelect.value][currentC]) {
            cSelect.value = currentC;
        }
    }

    // 5. Refresh the Genus dropdown
    gSelect.innerHTML = '<option value="">-- Select Genus --</option>';
    if (kSelect.value && cSelect.value && hierarchy[kSelect.value][cSelect.value]) {
        Object.keys(hierarchy[kSelect.value][cSelect.value]).sort().forEach(g => {
            gSelect.innerHTML += `<option value="${g}">${g}</option>`;
        });
        if (hierarchy[kSelect.value][cSelect.value].hasOwnProperty(currentG)) {
            gSelect.value = currentG;
        }
    }

    // 6. Rebind the standard linked events so the lower-level dropdowns refresh correctly when the user changes them manually
    kSelect.onchange = () => {
        // When the user manually changes Kingdom, clear and refresh the lower-level options
        cSelect.innerHTML = '<option value="">-- Select Category --</option>';
        gSelect.innerHTML = '<option value="">-- Select Genus --</option>';
        if (kSelect.value && hierarchy[kSelect.value]) {
            Object.keys(hierarchy[kSelect.value]).sort().forEach(c => {
                cSelect.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }
        updateMap();
    };

    cSelect.onchange = () => {
        // When the user manually changes Category, clear and refresh the lower-level options
        gSelect.innerHTML = '<option value="">-- Select Genus --</option>';
        if (kSelect.value && cSelect.value && hierarchy[kSelect.value][cSelect.value]) {
            Object.keys(hierarchy[kSelect.value][cSelect.value]).sort().forEach(g => {
                gSelect.innerHTML += `<option value="${g}">${g}</option>`;
            });
        }
        updateMap();
    };

    gSelect.onchange = updateMap;
}

// Core: filter data and update the map
function updateMap() {
    // 1. Remove the previous layer if it exists
    if (mainHeatLayer) {
        map.removeLayer(mainHeatLayer);
    }

    // 2. Filter data according to the UI state
    const filteredPoints = allData.filter(d => {
        const cityMatch = activeCities.has(d.city);
        const kMatch = kSelect.value ? d.kingdom === kSelect.value : true;
        const cMatch = cSelect.value ? d.category === cSelect.value : true;
        const gMatch = gSelect.value ? d.genus === gSelect.value : true;
        
        return cityMatch && kMatch && cMatch && gMatch;
    }).map(d => [d.lat, d.lng]); // Extract only the coordinates

    // 3. 绘制新热力图 (如果有数据)
    if (filteredPoints.length > 0) {
        mainHeatLayer = L.heatLayer(filteredPoints, {
            radius: 20,
            blur: 15,
            maxZoom: 10,
            gradient: {0.4: 'blue', 0.6: 'cyan', 0.7: 'lime', 0.8: 'yellow', 1: 'red'}
        }).addTo(map);

        // 可选：自动缩放地图以适应点
        // const bounds = L.latLngBounds(filteredPoints);
        // map.fitBounds(bounds);
    }
}


</script>

</body>
</html>
