version: '3.8'  

services:
  db:           
    image: postgres:17
    container_name: postgres_db
    environment:
      POSTGRES_DB: dashboard_database
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  init-db:
    image: postgres:17
    depends_on:
      - db
    volumes:
      - "./db/init:/init_files"
    entrypoint:
      - bash
      - -c
      - |
        export PGPASSWORD=dashboard
        echo "Waiting for postgres..."
        until pg_isready -h db -p 5432 -U dashboard; do
          sleep 2
        done

        echo "Checking files in /init_files:"
        ls -l /init_files

        psql -h db -U dashboard -d postgres -c 'CREATE DATABASE metabase_app_db;' || echo 'Database already exists';

        echo "Restoring Metabase..."
        pg_restore -h db -U dashboard -d metabase_app_db --clean --if-exists --no-owner --no-privileges /init_files/metabase_app_db.dump || echo "MB restore failed"

        echo "Restoring Business..."
        pg_restore -h db -U dashboard -d dashboard_database --clean --if-exists --no-owner --no-privileges /init_files/dashboard_database.dump || echo "Business restore failed"
        
        echo "Done"

  metabase:
    image: metabase/metabase:v0.58.1
    container_name: metabase_app
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app_db
      MB_DB_PORT: 5432
      MB_DB_USER: dashboard
      MB_DB_PASS: dashboard
      MB_DB_HOST: db

  api:
    build: .
    container_name: fastapi_api
    restart: always
    ports:
      - "8001:8000"
    depends_on:
      - db
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=dashboard_database
      - PGUSER=dashboard
      - PGPASSWORD=dashboard

  web:
    image: nginx:alpine
    container_name: nginx_web
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro