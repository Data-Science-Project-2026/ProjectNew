

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 3s
      retries: 10

  bioclip:
    build:
      context: .
      dockerfile: src/models/BioClip-Container/Dockerfile
    image: bioclip-service
    ports:
      - "5000:5000"
    volumes:
      - ./src/models/BioClip:/app/src/models/BioClip
    environment:
      USE_HALF: "true"
      TEXT_BATCH_SIZE: "512"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bert:
    build:
      context: .
      dockerfile: src/models/Bert-Container/Dockerfile
    image: bert-service
    ports:
      - "5001:5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  qwen:
    build:
      context: .
      dockerfile: src/models/Qwen-Container/Dockerfile
    image: qwen-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5002:5000"
    volumes:
      - ./src/models/Qwen-Container/images.md:/app/images.md:ro
      - ./src/models/Qwen-Container/comment.md:/app/comment.md:ro
    environment:
      OPENAI_API_KEY: "EMPTY"
      OPENAI_BASE_URL: "http://host.docker.internal:8000/v1"
      MODEL: "Qwen/Qwen3.5-4B"
      QWEN_IMAGE_INSTRUCTION: "/app/images.md"
      QWEN_COMMENT_INSTRUCTION: "/app/comment.md"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Orchestrator instances ─────────────────────────────────────────
  # Each orchestrator processes its own data split (no file overlap).
  # Scale by adding more services (orchestrator-3, orchestrator-4, …)
  # or by using: docker compose up --scale orchestrator-1=N
  # Each instance mounts a different host data directory.

  orchestrator-1:
    build:
      context: .
      dockerfile: src/pipeline/Orchestrator-Container/Dockerfile
    image: pipeline-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      bioclip:
        condition: service_healthy
      bert:
        condition: service_healthy
      qwen:
        condition: service_healthy
    volumes:
      - ./data/split_1:/data
      - ./src/models/Qwen-Container/images.md:/app/images.md:ro
      - ./src/models/Qwen-Container/comment.md:/app/comment.md:ro
    environment:
      PIPELINE_DATABASE_DSN: "dbname=mydb user=myuser password=mypass host=postgres port=5432"
    command: >
      --db-dsn "dbname=mydb user=myuser password=mypass host=postgres port=5432"
      --bio-service-url http://bioclip:5000
      --bert-service-url http://bert:5000
      --qwen-service-url http://qwen:5000
      --qwen-image-instruction-file /app/images.md
      --qwen-comment-instruction-file /app/comment.md
      --qwen-image-model "Qwen/Qwen3.5-4B"
      --qwen-text-model "Qwen/Qwen3.5-4B"
      upload-posts
      --city-folder /data

  orchestrator-2:
    build:
      context: .
      dockerfile: src/pipeline/Orchestrator-Container/Dockerfile
    image: pipeline-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      bioclip:
        condition: service_healthy
      bert:
        condition: service_healthy
      qwen:
        condition: service_healthy
    volumes:
      - ./data/split_2:/data
      - ./src/models/Qwen-Container/images.md:/app/images.md:ro
      - ./src/models/Qwen-Container/comment.md:/app/comment.md:ro
    environment:
      PIPELINE_DATABASE_DSN: "dbname=mydb user=myuser password=mypass host=postgres port=5432"
    command: >
      --db-dsn "dbname=mydb user=myuser password=mypass host=postgres port=5432"
      --bio-service-url http://bioclip:5000
      --bert-service-url http://bert:5000
      --qwen-service-url http://qwen:5000
      --qwen-image-instruction-file /app/images.md
      --qwen-comment-instruction-file /app/comment.md
      --qwen-image-model "Qwen/Qwen3.5-4B"
      --qwen-text-model "Qwen/Qwen3.5-4B"
      upload-posts
      --city-folder /data

volumes:
  pgdata:
