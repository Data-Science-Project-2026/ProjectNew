

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 3s
      retries: 10

  bioclip:
    build:
      context: .
      dockerfile: src/models/BioClip-Container/Dockerfile
    image: bioclip-service
    ports:
      - "5000:5000"
    environment:
      USE_HALF: "true"
      TEXT_BATCH_SIZE: "512"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bert:
    build:
      context: .
      dockerfile: src/models/Bert-Container/Dockerfile
    image: bert-service
    ports:
      - "5001:5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  local-llm:
    image: vllm/vllm-openai:cu130-nightly
    ports:
      - "8000:8000"
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${LOCAL_LLM_MODEL_DIR:-./models}:/models:ro
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      VLLM_NO_USAGE_STATS: ${VLLM_NO_USAGE_STATS:-1}
    command: >
      ${LOCAL_LLM_MODEL:-/models/Qwen3.5-4B}
      --max-model-len ${LOCAL_LLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${LOCAL_LLM_GPU_MEMORY_UTILIZATION:-0.7}
      --kv-cache-dtype ${LOCAL_LLM_KV_CACHE_DTYPE:-fp8}
      --max-num-batched-tokens ${LOCAL_LLM_MAX_BATCHED_TOKENS:-2048}
      ${LOCAL_LLM_EXTRA_ARGS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s


  # ── Orchestrator instances ─────────────────────────────────────────
  # Each orchestrator processes its own data split (no file overlap).
  # Scale by adding more services (orchestrator-3, orchestrator-4, …)
  # or by using: docker compose up --scale orchestrator-1=N
  # Each instance mounts a different host data directory.

  orchestrator-1:
    build:
      context: .
      dockerfile: src/pipeline/Orchestrator-Container/Dockerfile
    image: pipeline-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      bioclip:
        condition: service_healthy
      bert:
        condition: service_healthy
    volumes:
      - ./data/split_1:/data
      - ./src/models/Qwen-Container/images.md:/app/images.md:ro
      - ./src/models/Qwen-Container/comment.md:/app/comment.md:ro
    environment:
      PIPELINE_DATABASE_DSN: "dbname=mydb user=myuser password=mypass host=postgres port=5432"
    command: >
      --db-dsn "dbname=mydb user=myuser password=mypass host=postgres port=5432"
      --bio-service-url http://bioclip:5000
      --bert-service-url http://bert:5000
      --qwen-service-url http://local-llm:8000/v1
      --qwen-image-instruction-file /app/images.md
      --qwen-comment-instruction-file /app/comment.md
      --qwen-image-model "Qwen/Qwen3.5-4B"
      --qwen-text-model "Qwen/Qwen3.5-4B"
      upload-posts
      --city-folder /data

  orchestrator-2:
    build:
      context: .
      dockerfile: src/pipeline/Orchestrator-Container/Dockerfile
    image: pipeline-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      bioclip:
        condition: service_healthy
      bert:
        condition: service_healthy
    volumes:
      - ./data/split_2:/data
      - ./src/models/Qwen-Container/images.md:/app/images.md:ro
      - ./src/models/Qwen-Container/comment.md:/app/comment.md:ro
    environment:
      PIPELINE_DATABASE_DSN: "dbname=mydb user=myuser password=mypass host=postgres port=5432"
    command: >
      --db-dsn "dbname=mydb user=myuser password=mypass host=postgres port=5432"
      --bio-service-url http://bioclip:5000
      --bert-service-url http://bert:5000
      --qwen-service-url http://local-llm:8000/v1
      --qwen-image-instruction-file /app/images.md
      --qwen-comment-instruction-file /app/comment.md
      --qwen-image-model "Qwen/Qwen3.5-4B"
      --qwen-text-model "Qwen/Qwen3.5-4B"
      upload-posts
      --city-folder /data

volumes:
  pgdata:
