

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bioclip:
    build:
      context: .
      dockerfile: src/models/BioClip-Container/Dockerfile
    image: bioclip-service
    ports:
      - "5000:5000"
    # mount a directory containing token files if available
    volumes:
      - ./src/models/BioClip:/app/src/models/BioClip

  bert:
    build:
      context: .
      dockerfile: src/models/Bert-Container/Dockerfile
    image: bert-service
    ports:
      - "5001:5000"

  qwen:
    build:
      context: .
      dockerfile: src/models/Qwen-Container/Dockerfile
    image: qwen-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5002:5000"
    volumes:
      - ./src/models/Qwen-Container/prompt.md:/app/prompt.md:ro
    environment:
      # For local Qwen inference server (vLLM/similar)
      # Update BASE_URL to point to your Qwen server (e.g., http://host.docker.internal:8000/v1)
      OPENAI_API_KEY: "EMPTY"   # can use "EMPTY" for local inference servers
      OPENAI_BASE_URL: "http://host.docker.internal:8000/v1"  # adjust port if needed
      MODEL: "Qwen/Qwen3-VL-8B-Instruct-FP8"  # or your model name
      QWEN_INSTRUCTION_FILE: "/app/prompt.md"  # reads system prompt from this file

  orchestrator:
    build:
      context: .
      dockerfile: src/pipeline/Orchestrator-Container/Dockerfile
    image: pipeline-orchestrator
    depends_on:
      - postgres
      - bioclip
      - bert
      - qwen
    volumes:
      - ./data:/data
      - ./src/models/Qwen-Container/prompt.md:/app/prompt.md:ro
    command: >
      --db-dsn "dbname=mydb user=myuser password=mypass host=postgres port=5432"
      --bio-service-url http://bioclip:5000
      --bert-service-url http://bert:5000
      --qwen-service-url http://qwen:5000
      --qwen-instruction-file /app/prompt.md
      --qwen-model "Qwen/Qwen3-VL-8B-Instruct-FP8"
      --qwen-max-tokens 4096
      --qwen-temperature 0.2
      upload-posts
      --csv-dir /data/csvs
      --image-root /data/images

volumes:
  pgdata:
